<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vayu · Vehicle list explorations</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242321;background:#f5f5f3;font-size:13px}*{box-sizing:border-box}body{margin:0}header{max-width:1540px;margin:auto;padding:34px 28px 22px}header .eyebrow{font-size:10px;color:#d9551d;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{font-size:26px;letter-spacing:-.04em;margin:8px 0}header p{color:#77756f;margin:0;line-height:1.5}.gallery{max-width:1540px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:16px;padding:0 28px 36px}.option{min-width:0}.option-label{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}.option-label b{font-size:12px}.option-label span{font-size:10px;color:#88857f}.panel{background:#fff;border:1px solid #e6e5e1;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px #25221f08}.panel-top{padding:14px 14px 10px;border-bottom:1px solid #eee}.panel-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:650;margin-bottom:10px}.panel-title small{color:#92908b;font-size:10px;font-weight:500}.search{height:33px;border:1px solid #e6e5e1;border-radius:999px;color:#a09d98;display:flex;align-items:center;gap:8px;padding:0 11px;font-size:11px}.search svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}.filters{display:flex;gap:4px;margin-top:10px;overflow:hidden}.filters span{font-size:10px;font-weight:600;color:#85827d;padding:5px 7px;white-space:nowrap}.filters span:first-child{background:#fff0e8;color:#d9551d;border-radius:999px}.list{padding:0}.row{position:relative;padding:13px 14px;border-bottom:1px solid #efeeeb;min-height:83px}.row:last-child{border-bottom:0}.row.selected{background:#fff6f1;box-shadow:inset 3px 0 #f36c2d}.line{display:flex;align-items:center;justify-content:space-between;gap:8px}.id{font-weight:700;font-size:12px;color:#383734}.speed{font-size:11px;font-weight:700;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:650;border-radius:999px;padding:3px 7px;white-space:nowrap}.moving{background:#eaf6ef;color:#25734a}.idle{background:#f1f1f0;color:#73716c}.alert{background:#fdebec;color:#bd3d40}.meta{color:#77756f;font-size:10.5px;line-height:1.55;margin-top:6px}.time{color:#999690;font-size:10px}.name-line{display:flex;align-items:center;gap:6px;min-width:0}.location{display:flex;align-items:center;gap:4px}.dot{width:6px;height:6px;border-radius:50%;background:#25734a;display:inline-block}.dot.idle{background:#aaa7a2}.dot.alert{background:#bd3d40}.v2 .row{padding:13px 14px}.v2 .status{margin-top:7px;display:flex;justify-content:space-between;align-items:center}.v2 .meta{margin-top:4px}.v3 .row{margin:7px;border:1px solid #ecebe7;border-radius:10px;min-height:86px;padding:11px}.v3 .row.selected{border-color:#f6cbb8;box-shadow:none}.v3 .meta{margin-top:7px}.v4 .row{display:grid;grid-template-columns:30px 1fr;gap:9px;padding:13px}.avatar{width:30px;height:30px;border-radius:9px;background:#f3f2f0;color:#87847e;display:grid;place-items:center}.avatar svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}.v4 .selected .avatar{background:#fff;color:#f36c2d}.v4 .meta{margin-top:4px}.v5 .row{min-height:80px;padding:12px 14px}.v5 .meta{display:flex;justify-content:space-between;gap:6px;margin-top:8px}.v5 .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.v5 .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.v5 .status-text{font-size:10px;font-weight:600;color:#25734a}.v5 .status-text.idle-text{color:#77756f}.v5 .status-text.alert-text{color:#bd3d40}.note{font-size:11px;color:#85827d;line-height:1.5;padding:10px 3px 0}@media(max-width:600px){header{padding:24px 16px 18px}.gallery{padding:0 16px 24px;grid-template-columns:1fr}}
</style></head>
<body><header><div class="eyebrow">Vayu · Design exploration</div><h1>Vehicle list iterations</h1><p>Five directions for the fleet panel. Each uses the same sample vehicles and Vayu’s existing colors, typography, and compact controls.</p></header><main class="gallery" id="gallery"></main>
<script>
const vehicles=[{id:'VY-1001',status:'Moving',location:'Bengaluru',vehicle:'Tata Ace EV',driver:'Rahul Mehta',speed:'42 km/h',time:'Now'},{id:'VY-1002',status:'Idle',location:'Delhi',vehicle:'Ashok Leyland Dost',driver:'Priya Nair',speed:'0 km/h',time:'2 min'},{id:'VY-1003',status:'Alert',location:'Mumbai',vehicle:'Mahindra Bolero',driver:'Karan Singh',speed:'18 km/h',time:'1 min'},{id:'VY-1004',status:'Moving',location:'London',vehicle:'Tata Intra V30',driver:'Aisha Khan',speed:'36 km/h',time:'Now'},{id:'VY-1005',status:'Idle',location:'Paris',vehicle:'Eicher Pro 2049',driver:'Naveen Rao',speed:'0 km/h',time:'6 min'}];
const search='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg>';
const truck='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>';
const badge=v=>`<span class="badge ${v.status.toLowerCase()}">${v.status}</span>`;
const panelHeader='<div class="panel-top"><div class="panel-title">Fleet vehicles <small>3,000 vehicles</small></div><div class="search">'+search+' Search vehicle, driver or location</div><div class="filters"><span>All 3000</span><span>Moving</span><span>Idle</span><span>Alerts</span></div></div>';
const variants=[
{name:'01 · Refined compact',hint:'Familiar and balanced',desc:'A restrained refinement of the current list, with clearer hierarchy and a softer selection.',render:v=>`<div class="line"><div class="name-line"><span class="id">${v.id}</span>${badge(v)}</div><span class="speed">${v.speed}</span></div><div class="line meta"><div>${v.location}<br>${v.vehicle} · ${v.driver}</div><span class="time">${v.time}</span></div>`},
{name:'02 · Status first',hint:'Quick operational scan',desc:'Pairs each status with the latest update and keeps location and vehicle information together.',render:v=>`<div class="line"><span class="id">${v.id}</span><span class="speed">${v.speed}</span></div><div class="meta">${v.location} · ${v.vehicle}<br>${v.driver}</div><div class="status">${badge(v)}<span class="time">Updated ${v.time}</span></div>`},
{name:'03 · Soft cards',hint:'Distinct and approachable',desc:'Subtle card boundaries separate each vehicle while preserving a dense panel.',render:v=>`<div class="line"><div class="name-line"><span class="id">${v.id}</span>${badge(v)}</div><span class="speed">${v.speed}</span></div><div class="line meta"><div>${v.location}<br>${v.vehicle} · ${v.driver}</div><span class="time">${v.time}</span></div>`},
{name:'04 · Vehicle icon',hint:'Recognizable at a glance',desc:'A quiet Lucide-style vehicle icon anchors each entry and highlights the selected row.',render:v=>`<span class="avatar">${truck}</span><div><div class="line"><div class="name-line"><span class="id">${v.id}</span>${badge(v)}</div><span class="speed">${v.speed}</span></div><div class="meta">${v.location} · ${v.time}<br>${v.vehicle} · ${v.driver}</div></div>`},
{name:'05 · Minimal status',hint:'Most compact',desc:'Status dots replace filled badges to keep attention on vehicle details and speed.',render:v=>`<div class="line"><div class="name-line"><i class="dot ${v.status.toLowerCase()}"></i><span class="id">${v.id}</span></div><span class="speed">${v.speed}</span></div><div class="meta"><span>${v.location} · ${v.vehicle}</span><span>${v.time}</span></div><div class="bottom"><span class="time">${v.driver}</span><span class="status-text ${v.status.toLowerCase()}-text">${v.status}</span></div>`}
];
document.getElementById('gallery').innerHTML=variants.map((variant,i)=>`<section class="option v${i+1}"><div class="option-label"><b>${variant.name}</b><span>${variant.hint}</span></div><div class="panel">${panelHeader}<div class="list">${vehicles.map((v,j)=>`<div class="row ${j===0?'selected':''}">${variant.render(v)}</div>`).join('')}</div></div><p class="note">${variant.desc}</p></section>`).join('');
</script></body></html>
